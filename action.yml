name: Post Dependencies To Confluence
description: Replace a Confluence page with the list of dependencies provided as input
inputs:
  dependencies:
    description: 'Dependencies for the service to update the wiki with'
    required: true
  confluence-url:
    description: 'The URL to the Confluence wiki to update'
    required: true
  confluence-user:
    description: 'The username to use for authentication against Confluence'
    required: true
  confluence-token:
    description: 'The API token to use for authentication against Confluence'
    required: true
  confluence-content-id:
    description: 'The ID of the content page to update'
    required: true

runs:
  using: composite
  steps:
    - name: Install patched Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22.23.4'
        package-manager-cache: false
    - name: Post dependencies to Confluence
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_DEPENDENCIES: ${{ inputs.dependencies }}
        INPUT_CONFLUENCE-URL: ${{ inputs.confluence-url }}
        INPUT_CONFLUENCE-USER: ${{ inputs.confluence-user }}
        INPUT_CONFLUENCE-TOKEN: ${{ inputs.confluence-token }}
        INPUT_CONFLUENCE-CONTENT-ID: ${{ inputs.confluence-content-id }}
      run: node "$ACTION_PATH/lib/index.js"
